# Combined pre-commit and pre-push scan suite for bellwether-mcp.
#
# Repository-agnostic complexity, clone, security, privacy, supply-chain,
# hygiene and code-shape gates come from the shared Knuckles-Team/pipelines
# repository, referenced at `main` (never SHA-pinned — operator rule
# 2026-09-22: pipelines is always referenced at main).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
  - id: check-ast
  - id: check-yaml
    args: ["--unsafe"]
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-check
    args: ["--fix"]
  - id: ruff-format
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    exclude: ^(tests/|scripts/)
# ── Shared gates (Knuckles-Team/pipelines, ALWAYS at main) ──────────────────
- repo: https://github.com/Knuckles-Team/pipelines
  rev: main
  hooks:
  - id: connector-standard
  - id: secrets
  - id: spec
    stages: [pre-push]
  - id: tests-fast
    stages: [pre-push]
  - id: complexity-staged
    stages: [pre-commit, manual]
  - id: kiss-staged
    stages: [pre-commit, manual]
  - id: dupehound-changed
    stages: [pre-commit, manual]
  - id: complexity-census
    stages: [pre-push, manual]
  - id: kiss-census
    stages: [pre-push, manual]
  - id: jscpd-differential
    stages: [pre-push, manual]
  - id: jscpd-census
    stages: [pre-push, manual]
  - id: no-stub
    stages: [pre-commit, manual]
  - id: swallowed-errors
    stages: [pre-commit, manual]
  - id: event-loop-blocking
    stages: [pre-commit, manual]
  - id: import-cycles
    stages: [pre-commit, manual]
  - id: secret-history
    stages: [pre-push, manual]
  - id: security-sanitizer
    stages: [pre-commit, manual]
- repo: local
  hooks:
  - id: mypy
    name: mypy (project package)
    entry: bash -c 'uv run --frozen python -m mypy bellwether_mcp --ignore-missing-imports --check-untyped-defs'
    language: system
    pass_filenames: false
    files: ^(bellwether_mcp/.*\.py|pyproject\.toml)$
  - id: pytest
    name: pytest (full suite)
    entry: bash -c 'uv run --frozen python -m pytest -q'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
